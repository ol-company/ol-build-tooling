# Reusable workflow: quét bảo mật mã nguồn, dependency và bí mật.
#  - gitleaks     : bí mật lọt vào lịch sử Git
#  - CodeQL       : phân tích tĩnh mã TypeScript/JavaScript (miễn phí cho repo public)
#  - Trivy fs     : lỗ hổng trong dependency (lockfile) + cấu hình sai (Dockerfile, Terraform, YAML)
#  - dependency-review : chặn PR thêm dependency có lỗ hổng/giấy phép bị cấm
name: security-scan

on:
  workflow_call:
    inputs:
      codeql-languages:
        description: Ngôn ngữ cho CodeQL; để trống nếu repo không có mã (ví dụ chỉ Terraform)
        type: string
        default: javascript-typescript

permissions: {}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Quét toàn bộ lịch sử, không chỉ commit cuối
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/ol-build-tooling
          path: .tooling
          sparse-checkout: tool-versions.env
          persist-credentials: false
      - name: gitleaks
        run: |
          source .tooling/tool-versions.env
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --verbose --exit-code 1

  codeql:
    name: codeql
    if: inputs.codeql-languages != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # Đẩy kết quả lên tab Security
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.codeql-languages }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/ol-build-tooling
          path: .tooling
          sparse-checkout: tool-versions.env
          persist-credentials: false
      - name: Trivy (dependency + misconfig)
        run: |
          source .tooling/tool-versions.env
          # CRITICAL/HIGH đã có bản vá → lỗi; lỗ hổng chưa có bản vá chỉ báo cáo
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs /src \
            --scanners vuln,misconfig --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --skip-dirs /src/.tooling --skip-dirs /src/node_modules

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # Ghi bình luận tóm tắt vào PR
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
          comment-summary-in-pr: on-failure
