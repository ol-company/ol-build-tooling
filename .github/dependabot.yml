version: 2
updates:
  # Nâng image nền trong các Dockerfile tập trung (node, nginx, keycloak...)
  - package-ecosystem: docker
    directories: ["/dockerfiles/*"]
    schedule: { interval: weekly, day: monday, time: "08:00", timezone: Asia/Ho_Chi_Minh }
    commit-message: { prefix: build }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "08:00", timezone: Asia/Ho_Chi_Minh }
    groups:
      github-actions: { patterns: ["*"] }
    commit-message: { prefix: ci }
