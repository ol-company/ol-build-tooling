# Header bảo mật cho mọi phản hồi của frontend.
# Lưu ý nginx: add_header trong location GHI ĐÈ toàn bộ add_header của cấp cha → include lại ở mỗi location.

# CSP: chỉ tải script/style/ảnh/kết nối từ chính origin; cấm nhúng trang vào iframe
# style-src cần 'unsafe-inline' vì thư viện UI dùng thuộc tính style nội tuyến
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
