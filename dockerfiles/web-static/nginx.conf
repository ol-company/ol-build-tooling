# nginx phục vụ SPA. TLS kết thúc ở ALB/Caddy phía trước; container chỉ nghe HTTP 8080 nội bộ.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;                      # Không lộ phiên bản nginx

    # Health check cho ALB
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Runtime config: sinh lúc khởi động container, không được cache
    location = /config.json {
        alias /tmp/runtime/config.json;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # File có hash trong tên → cache vĩnh viễn
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Mọi đường dẫn khác trả index.html (client-side routing); index không được cache để nhận bản mới ngay
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
